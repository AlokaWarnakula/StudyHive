# Rendered by the nginx image's envsubst step: only ${PORT} is replaced; nginx's own $vars are
# left alone because they are not defined in the container environment.
server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Caching uses `expires`, not add_header, so the server-level headers above still apply here.
    # Fingerprinted Vite assets never change under the same name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/login, /approvals/...) all serve index.html, uncached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
