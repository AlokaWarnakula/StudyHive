name: mobile
description: "StudyHive student app — booking requests, tracking, QR check-in."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^8.2.1
  mobile_scanner: ^7.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # D3 / C-21: the real launcher icon and splash, generated from assets/brand.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png

# `dart run flutter_launcher_icons` regenerates the Android launcher icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#5980A6"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 21

# `dart run flutter_native_splash:create` regenerates the Android splash.
flutter_native_splash:
  color: "#F2F2F3"
  image: assets/brand/splash.png
  android_12:
    color: "#F2F2F3"
    image: assets/brand/icon_foreground.png
    icon_background_color: "#5980A6"
  ios: false
  web: false
