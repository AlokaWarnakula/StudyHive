services:
  db:
    image: postgres:16-alpine
    container_name: studyhive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyhive
      POSTGRES_USER: studyhive
      POSTGRES_PASSWORD: studyhive_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studyhive-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhive -d studyhive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studyhive-db-data:
